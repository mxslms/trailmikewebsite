version: '3.8'

services:
  web:
    build: .
    image: trailmike-web:latest
    container_name: trailmike-web
    restart: unless-stopped
    ports:
      - "8085:80"
    networks:
      web-network:
        # Keep old Docker DNS name so existing Cloudflare ingress still resolves
        aliases:
          - hello-world-web

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    command: tunnel --no-autoupdate run
    depends_on:
      - web
    networks:
      - web-network

networks:
  web-network:
    external: true
