services:
  web:
    build: .
    image: trailmike-web:latest
    container_name: trailmike-web
    restart: unless-stopped
    networks:
      web-network:
        # Keep old Docker DNS name so existing Cloudflare ingress still resolves
        aliases:
          - hello-world-web

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    environment:
      # Set CLOUDFLARE_TUNNEL_TOKEN in Portainer stack env (or a local .env for CLI)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - web
    networks:
      - web-network

networks:
  web-network:
    external: true
