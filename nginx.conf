server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # unsafe-inline on script-src/style-src is a deliberate tradeoff, not an
    # oversight: Astro inlines this site's nav-toggle script and per-image
    # background-image style attributes directly into the HTML (verified
    # against a real build), so a strict CSP here would silently break the
    # mobile nav and card images. default-src/frame-ancestors/object-src
    # still block loading resources from arbitrary external origins and
    # clickjacking, which is most of the real value for a static site with
    # no forms, no user input, and no server-side rendering.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
